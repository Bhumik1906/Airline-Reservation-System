{% extends "base.html" %}

{% block title %}Register - SkyBook Airlines{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom border-0 shadow">
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-3">
                    <i class="bi bi-person-plus-fill fs-1 mb-2 d-inline-block"></i>
                    <h4 class="fw-bold mb-0">Create an Account</h4>
                    <p class="text-white-50 small mb-0">Join SkyBook Airlines for seamless flight reservations</p>
                </div>

                <div class="card-body p-4">
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">
                                <i class="bi bi-person me-1 text-primary"></i> Full Name *
                            </label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Sharma" value="{{ name or '' }}" required autofocus>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary">
                                    <i class="bi bi-envelope me-1 text-primary"></i> Email Address *
                                </label>
                                <input type="email" name="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary">
                                    <i class="bi bi-telephone me-1 text-primary"></i> Phone Number
                                </label>
                                <input type="tel" name="phone" class="form-control" placeholder="e.g. 9876543210" value="{{ phone or '' }}">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary">
                                    <i class="bi bi-lock me-1 text-primary"></i> Password *
                                </label>
                                <input type="password" name="password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small text-secondary">
                                    <i class="bi bi-lock-fill me-1 text-primary"></i> Confirm Password *
                                </label>
                                <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
                            <i class="bi bi-check2-circle me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            Already registered? 
                            <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">
                                Sign In here
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
