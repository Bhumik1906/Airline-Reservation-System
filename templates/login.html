{% extends "base.html" %}

{% block title %}Login - SkyBook Airlines{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom border-0 shadow">
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-3">
                    <i class="bi bi-person-circle fs-1 mb-2 d-inline-block"></i>
                    <h4 class="fw-bold mb-0">Welcome Back</h4>
                    <p class="text-white-50 small mb-0">Log in to manage your flight bookings</p>
                </div>

                <div class="card-body p-4">
                    <form action="{{ url_for('login') }}" method="POST">
                        <input type="hidden" name="next" value="{{ next or '' }}">

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">
                                <i class="bi bi-envelope me-1 text-primary"></i> Email Address
                            </label>
                            <input type="email" name="email" id="loginEmail" class="form-control form-control-lg" placeholder="name@example.com" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">
                                <i class="bi bi-lock me-1 text-primary"></i> Password
                            </label>
                            <input type="password" name="password" id="loginPassword" class="form-control form-control-lg" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <!-- QUICK DEMO CREDENTIALS BOX (SUPER HELPFUL FOR COLLEGE DEMO/VIVA) -->
                    <div class="p-3 bg-light rounded-3 border mt-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="small fw-bold text-secondary">
                                <i class="bi bi-info-circle me-1"></i> Quick Demo Fill:
                            </span>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="fillCredentials('rahul@gmail.com', 'user123')">
                                <i class="bi bi-person me-1"></i> User Demo
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger w-50" onclick="fillCredentials('admin@skybook.com', 'admin123')">
                                <i class="bi bi-shield-lock me-1"></i> Admin Demo
                            </button>
                        </div>
                        <small class="text-muted d-block text-center mt-2" style="font-size: 0.75rem;">
                            Clicking above automatically fills pre-configured credentials!
                        </small>
                    </div>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            Don't have an account yet? 
                            <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">
                                Register here
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
